name: Release

# Push a tag like v0.1.0 and this builds the desktop app for Windows, macOS and Linux,
# then attaches the installers to a draft GitHub Release. Free on public repositories.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx electron-builder --publish never
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
